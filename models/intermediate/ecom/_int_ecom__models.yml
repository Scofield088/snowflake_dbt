version: 2

models:
  - name: int_customers_deduplicated
    description: "Intermediate model containing deduplicated and formatted customer profiles."
    columns:
      - name: customer_key
        description: "Generated surrogate key."
        tests:
          - unique
          - not_null

      - name: customer_id
        description: "Natural key."
        tests:
          - unique
          - not_null

  - name: int_orders_joined_to_products
    description: "Intermediate model joining deduplicated orders to their catalog descriptions."
    columns:
      - name: order_key
        description: "Grain surrogate key."
        tests:
          - unique
          - not_null

      - name: payment_status
        description: "Standardized payment status."
        tests:
          - accepted_values:
              arguments:
                values: ['COMPLETED', 'PENDING', 'FAILED', 'UNKNOWN']